name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar
        run: dotnet build -c Release

      - name: Enviar o DLL
        uses: actions/upload-artifact@v4
        with:
          name: HostOnlyMod
          path: bin/Release/net6.0/HostOnlyMod.dll
