name: Compilar mod
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
 
      - name: Diagnostico do pacote do jogo
        continue-on-error: true
        run: |
          dotnet restore
          echo "=== csproj ==="
          grep -E "GameVersion|GamePlatform" HostOnlyMod.csproj
          echo "=== DLLs do jogo ==="
          find ~/.nuget/packages -ipath "*amongus.gamelibs*" -name "*.dll" | head -50
          f=$(find ~/.nuget/packages -ipath "*amongus.gamelibs*" -name "Assembly-CSharp.dll" | head -1)
          echo "=== Tipos parecidos ==="
          strings -a "$f" | grep -E "ShipStatus|LobbyBehaviour|^GameData" | sort -u | head -40
 
      - name: Compilar
        run: dotnet build -c Release
 
      - name: Enviar o DLL
        uses: actions/upload-artifact@v4
        with:
          name: HostOnlyMod
          path: bin/Release/net6.0/HostOnlyMod.dll
